# SPDX-FileCopyrightText: Copyright (c) 2026 The Newton Developers
# SPDX-License-Identifier: Apache-2.0

header:
  license:
    spdx-id: Apache-2.0
    copyright-owner: The Newton Developers
    content: |
      SPDX-FileCopyrightText: Copyright (c) 2026 The Newton Developers
      SPDX-License-Identifier: Apache-2.0
    # SkyWalking Eyes lowercases text and normalizes "(c)" to "copyright".
    pattern: |
      spdx-filecopyrighttext: copyright copyright \d{4} the newton developers
      spdx-license-identifier: apache-2\.0

  paths:
    - "**/*.py"
    - "**/*.yaml"
    - "**/*.yml"
    - "**/*.toml"
    # These are retained software example fixtures, including their reports.
    - "examples/cable_calibration/data/asset.md"
    - "examples/cable_calibration/reports/*.html"

  comment: never
