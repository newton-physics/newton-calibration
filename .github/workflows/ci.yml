name: CPU checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Codecov only tracks main, so other runs skip the coverage report
  # artifact. Keep in sync with the codecov-upload job condition.
  UPLOAD_TO_CODECOV: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.13.5"
          prune-cache: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU dependencies
        run: uv sync --locked --python "${{ matrix.python }}" --extra cma --extra cable --extra dev
      - name: Repository checks
        run: uv run --no-sync pre-commit run --all-files
      - name: Core behavior
        if: matrix.python != '3.12'
        run: uv run --no-sync -m newton_calibration.tests
      - name: Core behavior with coverage
        if: matrix.python == '3.12'
        env:
          # sys.monitoring coverage core: avoids settrace overhead in unmeasured code
          COVERAGE_CORE: "sysmon"
        run: |
          uv run --no-sync -m coverage run -m newton_calibration.tests
          uv run --no-sync -m coverage report
          uv run --no-sync -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Write coverage XML
        if: ${{ matrix.python == '3.12' && env.UPLOAD_TO_CODECOV == 'true' }}
        run: uv run --no-sync -m coverage xml -o coverage.xml
      - name: Upload coverage artifact
        if: ${{ matrix.python == '3.12' && env.UPLOAD_TO_CODECOV == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage
          path: coverage.xml
          retention-days: 1
          overwrite: true
      - name: Archived evidence
        run: uv run --no-sync -m examples.cable_calibration.verify
      - name: Synthetic calibration demos
        run: |
          uv run --no-sync newton-calibration demo --case sliding --optimizer grid --workspace "$RUNNER_TEMP/sliding"
          uv run --no-sync newton-calibration demo --case oscillator --optimizer cma_es --workspace "$RUNNER_TEMP/oscillator"
      - name: Build package and check installed wheel
        run: |
          uv run --no-sync -m build
          uv pip uninstall newton-calibration
          uv pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          run="uv run --no-sync --project $GITHUB_WORKSPACE"
          $run python -c "from newton_calibration import Template, Tuning"
          $run newton-calibration demo --case sliding --optimizer grid --workspace "$RUNNER_TEMP/wheel-sliding"
          $run python -m newton_calibration.migrate_asset "$GITHUB_WORKSPACE/newton_calibration/tests/fixtures/legacy-sliding-asset.json" migrated.json
          $run python -c "from newton_calibration.examples import SlidingAsset; assert SlidingAsset({}).reload('migrated.json').baseline_parameters['friction'] == 0.35"

  codecov-upload:
    name: Upload coverage to Codecov
    needs: cpu
    timeout-minutes: 10
    # Codecov only tracks main: pull request runs skip the upload.
    # Mirrors UPLOAD_TO_CODECOV, which a job-level condition cannot read.
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Same-run artifact downloads use the runtime token; contents access is
    # only used to build Codecov's source network for coverage path mapping.
    permissions:
      contents: read
    steps:
      # *.blob.core.windows.net is intentionally broad: GitHub artifact storage
      # uses rotating productionresultssaN hosts and harden-runner only supports
      # leading full-label wildcards.
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.blob.core.windows.net:443
            cli.codecov.io:443
            github.com:443
            ingest.codecov.io:443
            keybase.io:443
            o26192.ingest.us.sentry.io:443
            results-receiver.actions.githubusercontent.com:443
            storage.googleapis.com:443
      - name: Checkout source for coverage path mapping
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github
            newton_calibration
      - name: Download coverage artifact
        id: download-coverage
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage
      - name: Upload coverage reports to Codecov
        if: ${{ steps.download-coverage.outcome == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./coverage.xml
          plugins: noop
          token: ${{ secrets.CODECOV_TOKEN }}
