name: CPU checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU dependencies
        run: python -m pip install -e ".[cma,cable,dev]"
      - name: Repository checks
        run: pre-commit run --all-files
      - name: Core behavior and archived evidence
        run: |
          python -m pytest -q
          python -m examples.cable_calibration.verify
      - name: Synthetic calibration demos
        run: |
          newton-calibration demo --case sliding --optimizer grid --workspace "$RUNNER_TEMP/sliding"
          newton-calibration demo --case oscillator --optimizer cma_es --workspace "$RUNNER_TEMP/oscillator"
      - name: Build package and check installed wheel
        run: |
          python -m build
          python -m pip uninstall -y newton-calibration
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "from newton_calibration import Template, Tuning"
          newton-calibration demo --case sliding --optimizer grid --workspace "$RUNNER_TEMP/wheel-sliding"
          python -m newton_calibration.migrate_asset "$GITHUB_WORKSPACE/newton_calibration/tests/fixtures/legacy-sliding-asset.json" migrated.json
          python -c "from newton_calibration.examples import SlidingAsset; assert SlidingAsset({}).reload('migrated.json').baseline_parameters['friction'] == 0.35"
