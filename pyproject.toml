[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "task-tuning"
version = "0.2.0"
description = "Composable, evidence-based calibration for the Newton ecosystem"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.2"]

[project.optional-dependencies]
cma = ["cma>=4,<5"]
cable = ["scipy>=1.11"]
gl = ["pyglet>=2.1,<3"]
dev = ["pytest>=8", "ruff==0.16.10", "pre-commit>=4,<5", "build>=1,<2"]

[project.urls]
Repository = "https://github.com/newton-physics/newton-calibration"
Issues = "https://github.com/newton-physics/newton-calibration/issues"

[project.scripts]
task-tuning = "task_tuning.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
cache-dir = ".cache/ruff"
line-length = 120
indent-width = 4
target-version = "py311"
exclude = ["*.js"]
# Preserve archived adapter snapshots and their recorded hashes.
extend-exclude = ["examples/cable_calibration/backends"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "I",   # isort
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "NPY", # NumPy-specific rules
    "PLC", # pylint convention
    "PLE", # pylint error
    "PLW", # pylint warning
    "UP",  # pyupgrade
    "RUF",  # ruff-specific rules
    "TID253",  # banned module-level imports
]
ignore = [
    "E501",   # Many lines are over 120 characters already (TODO: Fix)
    "E741",   # Warp often uses l as a variable name
    "UP018",  # Warp kernels often use float(val) and int(val)
    "RUF046", # Warp kernels often use int(val)
    "F811",   # Allow Warp kernel/function overloads
    "TC001",  # Allow quotations in type annotations, e.g. Literal["a"]
    "TC002",
    "TC003",
    "F821",
]

[tool.ruff.lint.per-file-ignores]
"examples/**/*" = ["E402", "TID253"]

[tool.ruff.lint.flake8-tidy-imports]
banned-module-level-imports = [
    "cma",
    "matplotlib",
    "newton",
    "PIL",
    "pyglet",
    "pxr",
    "scipy",
    "torch",
    "warp",
]
